[package]
name = "adm"
version = "0.2.2"
edition = "2024"
description = "ADM: a fast, lightweight download manager with browser integration."
license = "Apache-2.0"
repository = "https://github.com/Axenith/ADM"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adm-core = { path = "../crates/adm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon"] }
tokio = { version = "1", features = ["time", "net", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
