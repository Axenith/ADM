<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grab links - ADM</title>
<link rel="stylesheet" href="welcome.css">
<link rel="stylesheet" href="grab.css">
</head>
<body>
<main class="wide">
  <header><img src="icons/128.png" width="48" height="48" alt=""><div><h1>Grab links</h1><p id="source">…</p></div></header>
  <div class="bar">
    <div id="chips" class="chips" role="tablist"></div>
    <input id="q" type="search" placeholder="Filter by name or address" spellcheck="false">
  </div>
  <div class="tools"><button id="all" type="button">Select all shown</button><button id="none" type="button">Select none</button><span id="shown" class="muted"></span></div>
  <ul id="links"></ul>
  <p id="empty" class="muted center" hidden>Nothing here.</p>
  <footer class="sticky"><span id="picked">0 selected</span><span id="result" class="muted"></span><button id="send" class="primary" type="button" disabled>Download selected</button></footer>
</main>
<script type="module" src="grab.js"></script>
</body>
</html>
