<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside class="side" aria-label="Downloads">
  <div class="brand"><img src="logo.png" width="30" height="30" alt=""><span>ADM</span></div>
  <nav id="lib" aria-label="Library">
    <h3>Library</h3>
    <button data-lib="all" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><span>All Downloads</span><b>0</b></button>
    <button data-lib="incomplete"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Incomplete</span><b>0</b></button>
    <button data-lib="completed"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.5 2.5 4.5-5"/></svg><span>Completed</span><b>0</b></button>
  </nav>
  <nav id="types" aria-label="File types">
    <h3>File types</h3>
    <button data-type="all" class="on"><i class="dot" style="--c:#4c8dff"></i><span>All Types</span><b>0</b></button>
    <button data-type="doc"><i class="dot" style="--c:#8b93a7"></i><span>Documents</span><b>0</b></button>
    <button data-type="archive"><i class="dot" style="--c:#2fc78b"></i><span>Compressed</span><b>0</b></button>
    <button data-type="audio"><i class="dot" style="--c:#f2a03d"></i><span>Music</span><b>0</b></button>
    <button data-type="video"><i class="dot" style="--c:#a78bfa"></i><span>Video</span><b>0</b></button>
    <button data-type="app"><i class="dot" style="--c:#1fd1a0"></i><span>Programs</span><b>0</b></button>
    <button data-type="other" hidden><i class="dot" style="--c:#6b7388"></i><span>Other</span><b>0</b></button>
  </nav>
</aside>

<section class="content">
  <div class="toolbar" role="toolbar" aria-label="Actions">
    <button id="tb-new" class="tb" title="Add a link (Ctrl+N)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button>
    <button id="tb-clear" class="tb" title="Remove finished downloads from the list (the files stay)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span>Clear</span></button>
    <div class="menu-wrap">
      <button id="tb-sort" class="tb" aria-haspopup="menu" aria-expanded="false" title="Sort the list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg><span>Sort</span></button>
      <div class="menu" id="sort-menu" role="menu" hidden></div>
    </div>
    <button id="open-settings" class="tb" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
    <label class="search"><input id="q" type="search" placeholder="Search" spellcheck="false" autocomplete="off" aria-label="Search downloads"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></label>
    <div class="menu-wrap">
      <button id="tb-more" class="icon" aria-haspopup="menu" aria-expanded="false" title="More" aria-label="More"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="menu right" id="more-menu" role="menu" hidden></div>
    </div>
  </div>

  <form id="add" autocomplete="off" hidden>
    <svg class="lead" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    <input id="url" type="text" placeholder="Paste a link to download (several links: separate them with spaces)" spellcheck="false">
    <button class="primary" type="submit">Download</button>
    <button class="icon" type="button" id="add-x" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </form>

  <main>
    <ul id="list"></ul>
    <div id="empty" class="empty">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
      <strong id="empty-title">No downloads yet</strong>
      <span id="empty-sub">Click New and paste a link. Big files are split across several connections, so they finish sooner.</span>
    </div>
  </main>

  <footer class="status">
    <span id="st-left">Ready</span>
    <span id="st-speed"></span>
  </footer>
</section>
</div>

<div id="toasts" role="status" aria-live="polite"></div>

<dialog id="newdl" aria-labelledby="nd-title">
  <div class="nd-head"><h2 id="nd-title">New download</h2><button type="button" id="nd-x" class="icon" title="Cancel" aria-label="Cancel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="nd-body">
    <div class="nd-side"><div class="ftype" id="nd-icon"></div><div class="nd-size" id="nd-size">…</div></div>
    <div class="nd-fields">
      <label id="nd-file-row"><span>File</span><input id="nd-name" type="text" spellcheck="false"></label>
      <div class="nd-batch" id="nd-batch" hidden><ul id="nd-batch-list"></ul></div>
      <label id="nd-cat-row"><span>Category</span>
        <select id="nd-cat">
          <option value="">General</option><option>Video</option><option>Music</option><option>Documents</option><option>Compressed</option><option>Programs</option>
        </select>
      </label>
      <label><span>Save to</span>
        <div class="nd-path"><input id="nd-dir" type="text" spellcheck="false"><button type="button" id="nd-browse" class="icon" title="Browse…" aria-label="Browse for a folder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button></div>
      </label>
      <div class="nd-free" id="nd-free"></div>
      <label class="nd-inline"><span>Connections</span><input id="nd-seg" type="number" min="1" max="32"></label>
      <button type="button" id="nd-block" class="linkbtn" hidden>Don't capture downloads from <b id="nd-site"></b></button>
    </div>
  </div>
  <p class="nd-note" id="nd-note" hidden></p>
  <div class="nd-foot"><span class="nd-more" id="nd-more"></span><button type="button" id="nd-cancel" class="ghost">Cancel</button><button type="button" id="nd-go" class="primary">Download</button></div>
</dialog>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label>
      <span>Connections per download</span>
      <input id="s-conn" type="number" min="1" max="32">
      <small>More connections finish big files sooner, up to what the server allows. 8 is a good default.</small>
    </label>
    <label>
      <span>Downloads at the same time</span>
      <input id="s-simul" type="number" min="0" max="20">
      <small>The rest wait in the queue and start as others finish. 0 means no limit.</small>
    </label>
    <label>
      <span>Speed limit (KiB/s)</span>
      <input id="s-limit" type="number" min="0">
      <small>0 means no limit. Shared by all downloads.</small>
    </label>
    <label>
      <span>Download folder</span>
      <input id="s-dir" type="text" spellcheck="false">
    </label>
    <label class="check"><input id="s-ask" type="checkbox"><span>Ask before starting a download</span><small>Shows the “New download” window for links from the browser and the link box.</small></label>
    <label class="check"><input id="s-remember" type="checkbox"><span>Remember the folder I choose</span><small>New downloads start in the folder you used last time, instead of always in the download folder above.</small></label>
    <label class="check"><input id="s-sort" type="checkbox"><span>Sort into folders by file type</span><small>Video, Music, Documents, Compressed and Programs go into their own folders.</small></label>
    <label>
      <span>Browser downloads to take over</span>
      <textarea id="s-types" rows="3" spellcheck="false" placeholder="zip iso mp4 pdf …"></textarea>
      <small>File types the browser extension hands to ADM. Anything else stays in the browser.</small>
    </label>
    <label>
      <span>Also take over any file larger than (MB)</span>
      <input id="s-over" type="number" min="0">
      <small>Whatever its type. 0 turns this off.</small>
    </label>
    <label>
      <span>Don't capture downloads from these sites</span>
      <textarea id="s-blocked" rows="3" spellcheck="false" placeholder="one site per line, e.g. example.com"></textarea>
      <small>The browser extension leaves these sites' downloads to the browser.</small>
    </label>
    <menu>
      <button value="cancel" class="ghost">Cancel</button>
      <button value="save" class="primary">Save</button>
    </menu>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
