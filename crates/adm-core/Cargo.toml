[package]
name = "adm-core"
version = "0.2.2"
edition = "2024"
description = "Segmented, resumable HTTP(S) download engine: the core of ADM."
license = "Apache-2.0"
repository = "https://github.com/Axenith/ADM"

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls-no-provider", "socks", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
